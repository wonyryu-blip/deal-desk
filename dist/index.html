function editor(kind,cid,edit){let current=kind==='company'?state.companies.find(c=>c.id===cid):state[kind==='deal'?'deals':'reports'].find(x=>x.id===edit);current=current||{};let fields='';if(kind==='company')fields=field('����� *','name',current.name,'text',true)+field('���','sector',current.sector)+options('���� �ܰ�','stage',['Seed','Series A','Series B','Growth','Pre-IPO','��Ÿ'],current.stage)+field('�����','manager',current.manager)+area('��� �Ұ�','summary',current.summary)+area('�ٽ� ���� ����','thesis',current.thesis);else if(kind==='deal')fields=field('�� �̸� *','name',current.name,'text',true)+field('���� ���� *','fund',current.fund,'text',true)+field('������','date',current.date||today(),'date',true)+field('���ڱݾ� �� ��� *','amount',current.amount,'number',true)+options('����','status',['������','���ڿϷ�','ȸ������','ȸ���Ϸ�','����'],current.status);else fields=field('�ڷ� ���� *','title',current.title,'text',true)+options('�ڷ� ����','type',['���ڽ���','�ǻ�','�б� ����͸�','���� ��Ʈ','ȸ�� ����','��Ÿ'],current.type)+field('�ۼ���','date',current.date||today(),'date',true)+`<label>���� ��<select name="dealId"><option value="">��� ����</option>${state.deals.filter(d=>d.companyId===cid).map(d=>`<option value="${d.id}" ${d.id===current.dealId?'selected':''}>${esc(d.name)} �� ${esc(d.fund)}</option>`).join('')}</select></label>`+area('���� / �ٽ� ���','body',current.body)+field('���� ��ũ �� HTTPS','url',current.url,'url')+`<label>������ ÷�� �� ���ϴ� �ִ� 20MB<input type="file" name="attachment" accept=".pdf,.doc,.docx,.ppt,.pptx,.xls,.xlsx,.txt,.md,.csv,.png,.jpg,.jpeg"></label><div class="muted">${esc(current.fileName||'PDF��Word��Excel �� ������ �����ϰ� �ٿ�ε��� �� �ֽ��ϴ�.')} �� �� ���� ���� �� ���� ÷�� ��ü</div>`;$('#modal').innerHTML=`<form><h2>${kind==='company'?'���':kind==='deal'?'���� ��':'��Ʈ / ������'} ${current.id?'����':'���'}</h2>${fields}<p id="error" role="alert" style="color:#a22"></p><div class="actions"><button type="button" data-action="close">���</button
