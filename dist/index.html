<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Deal Desk · 투자기업 도서관</title><style>
:root{--navy:#122b36;--ink:#223b45;--muted:#76868b;--line:#dce4e4;--green:#16776a}*{box-sizing:border-box}body{margin:0;background:#f4f6f5;color:var(--ink);font:14px/1.6 system-ui,'Malgun Gothic',sans-serif}button,input,select,textarea{font:inherit}button,a{cursor:pointer}button{border:1px solid var(--line);background:white;color:var(--ink);border-radius:7px;padding:9px 14px}button:hover{border-color:var(--green);color:var(--green)}button.primary{background:var(--green);color:white;border-color:var(--green)}aside{position:fixed;width:225px;inset:0 auto 0 0;background:var(--navy);color:#c1ced0;padding:32px 23px}aside h2{color:white;margin:0;font-size:26px;letter-spacing:-1px}aside small{color:#8ea8ad;letter-spacing:2px}nav{margin-top:45px;display:grid;gap:10px}nav a{padding:11px 14px;color:inherit;text-decoration:none;border-radius:6px}nav a:hover,nav a.active{background:#29434c;color:white}.aside-bottom{position:absolute;bottom:30px;font-size:12px;width:178px;color:#9ab0b5}main{margin-left:225px;padding:35px 4.5%;max-width:1600px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}.eyebrow{font-size:11px;letter-spacing:2px;color:var(--green);font-weight:700}h1{font-size:30px;letter-spacing:-1px;margin:6px 0}h2{font-size:19px;margin:0 0 14px}p{margin:6px 0;color:var(--muted)}.actions{display:flex;gap:8px;flex-wrap:wrap}.notice{background:#e9f0ee;border:1px solid #d6e5df;border-radius:8px;padding:12px 16px;margin:25px 0;font-size:12px;color:#48645c}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:30px}.stat{background:white;border:1px solid var(--line);border-radius:10px;padding:19px 23px}.stat span{font-size:12px;color:var(--muted)}.stat strong{display:block;font-size:30px;font-weight:600;margin-top:7px}.panel{background:white;border:1px solid var(--line);border-radius:10px;padding:23px;margin-bottom:23px}.filters{display:flex;gap:10px;margin:18px 0;flex-wrap:wrap}input,select,textarea{border:1px solid var(--line);padding:10px 12px;border-radius:6px;background:white;color:var(--ink);max-width:100%}input[type=search]{min-width:270px;flex:1}table{width:100%;border-collapse:collapse;text-align:left}th{font-size:11px;color:var(--muted);font-weight:500;background:#f6f8f7}td,th{padding:15px 12px;border-bottom:1px solid #edf0f0}td a{font-weight:650;color:var(--ink);text-decoration:none}td a:hover{color:var(--green)}.badge{font-size:11px;background:#e8f2ed;color:#26705c;border-radius:5px;padding:4px 8px}.muted{font-size:12px;color:var(--muted)}.empty{text-align:center;padding:48px 20px;color:var(--muted)}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:15px}.card{border:1px solid var(--line);border-radius:8px;padding:19px;background:white}.card h3{margin:10px 0}.card a{color:var(--green)}.detail-grid{display:grid;grid-template-columns:1fr 2fr;gap:22px}.pre{white-space:pre-wrap;overflow-wrap:anywhere;color:var(--ink)}dialog{border:0;border-radius:12px;box-shadow:0 20px 100px #122b3655;padding:28px;width:560px;max-width:94vw;max-height:88vh;overflow:auto}dialog::backdrop{background:#142a3580}label{display:block;margin:12px 0;font-size:12px}label input,label textarea,label select{display:block;width:100%;margin-top:5px}textarea{min-height:110px}form .actions{justify-content:flex-end;margin-top:20px}.scroll{overflow-x:auto}#toast{position:fixed;bottom:25px;right:25px;background:var(--navy);color:white;padding:12px 22px;border-radius:8px;display:none;z-index:10}footer{font-size:11px;color:var(--muted);margin:30px 0}button:focus-visible,a:focus-visible{outline:3px solid #65ad9f;outline-offset:3px}@media(max-width:850px){aside{position:relative;width:auto;padding:18px 22px}aside h2{font-size:22px}aside small,.aside-bottom{display:none}nav{display:flex;margin-top:12px;gap:0}main{margin:0;padding:24px 18px}.stats{grid-template-columns:repeat(2,1fr)}.detail-grid{grid-template-columns:1fr}h1{font-size:25px}}
</style></head><body><aside><h2>Deal Desk<span style="color:#6fb7a5">.</span></h2><small>PRIVATE MARKETS</small><nav><a href="#/" id="nav-home">◫ &nbsp; 투자 대시보드</a><a href="#/library" id="nav-library">▤ &nbsp; 전체 도서관</a></nav><div class="aside-bottom">투자의 판단과 기록을<br>기업 중심으로 연결합니다.<hr style="border:0;border-top:1px solid #35505a;margin:20px 0">브라우저 보관 모드<br>자료는 현재 브라우저에 저장됩니다.</div></aside><main id="app"></main><dialog id="modal"></dialog><div id="toast" role="status"></div><script>
'use strict';
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let db,state={companies:[],deals:[],reports:[]};const uid=()=>crypto.randomUUID(),today=()=>new Date().toLocaleDateString('sv-SE'),num=n=>Number(n||0).toLocaleString('ko-KR');
const req=r=>new Promise((resolve,reject)=>{r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)});
async function init(){try{let r=indexedDB.open('deal-desk-v1',1);r.onupgradeneeded=()=>r.result.createObjectStore('data');db=await req(r);state=await req(db.transaction('data').objectStore('data').get('workspace'))||state;render()}catch(e){$('#app').textContent='브라우저 저장소에 접근할 수 없습니다. 일반 브라우저에서 다시 열어주세요.'}}
async function save(next){await new Promise((resolve,reject)=>{const t=db.transaction('data','readwrite');t.objectStore('data').put(next,'workspace');t.oncomplete=resolve;t.onerror=()=>reject(t.error);t.onabort=()=>reject(t.error)});state=next;render()}
function toast(s){$('#toast').textContent=s;$('#toast').style.display='block';setTimeout(()=>$('#toast').style.display='none',3500)}
function header(title,sub,actions=''){return `<div class="top"><div><div class="eyebrow">INVESTMENT WORKSPACE</div><h1>${title}</h1><p>${sub}</p></div><div class="actions">${actions}</div></div>`}
const newCompany='<button class="primary" data-action="company">＋ 기업 등록</button>',backup='<button data-action="export">백업 내보내기</button><button data-action="import">백업 불러오기</button>';
function reportCards(reports){return reports.length?`<div class="cards">${reports.map(r=>`<article class="card"><div class="top"><span class="badge">${esc(r.type)}</span><span class="muted">${esc(r.date)}</span></div><h3><a href="#/report/${r.id}">${esc(r.title)}</a></h3><p>${esc(state.companies.find(c=>c.id===r.companyId)?.name||'')}</p><div class="muted">${esc(r.fileName||'작성 노트')}${r.dealId?' · 딜 연결':''}</div></article>`).join('')}</div>`:'<div class="empty">등록된 자료가 없습니다. 기업 상세에서 첫 노트나 보고서를 추가하세요.</div>'}
function render(){const parts=location.hash.split('/'),page=parts[1]||'',id=parts[2];$('#nav-home').classList.toggle('active',page!=='library');$('#nav-library').classList.toggle('active',page==='library');let out='';
if(page==='company'){const c=state.companies.find(c=>c.id===id);if(!c){location.hash='/';return}const deals=state.deals.filter(d=>d.companyId===id),reports=state.reports.filter(r=>r.companyId===id).sort((a,b)=>b.date.localeCompare(a.date));out=`<a href="#/" style="color:var(--green)">← 전체 기업</a>`+header(esc(c.name),`${esc(c.sector)} · ${esc(c.stage)}`,`<button data-action="company" data-id="${id}">기업 수정</button><button data-action="deal" data-id="${id}">＋ 투자 딜</button><button class="primary" data-action="report" data-id="${id}">＋ 노트 / 보고서</button>`)+`<div class="detail-grid" style="margin-top:25px"><section class="panel"><h2>기업 개요</h2><div class="pre">${esc(c.summary||'기업 소개를 입력하세요.')}</div><hr style="border:0;border-top:1px solid var(--line);margin:22px 0"><span class="muted">주요 투자 논리</span><div class="pre">${esc(c.thesis||'미입력')}</div><p>담당자 · ${esc(c.manager||'미지정')}</p></section><section class="panel"><h2>투자 딜 <span class="muted">${deals.length}건 · 금액 단위: 억원</span></h2>${deals.length?`<div class="scroll"><table><thead><tr><th>딜 / 조합</th><th>투자일</th><th>금액</th><th>상태</th><th></th></tr></thead><tbody>${deals.map(d=>`<tr><td>${esc(d.name)}<div class="muted">${esc(d.fund)}</div></td><td>${esc(d.date)}</td><td>${num(d.amount)}</td><td><span class="badge">${esc(d.status)}</span></td><td><button data-action="deal" data-id="${id}" data-edit="${d.id}">수정</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">첫 투자 딜을 등록하세요.</div>'}</section></div><section class="panel"><h2>기업 리서치 도서관 <span class="muted">${reports.length}개 자료 · 최신순</span></h2>${reportCards(reports)}</section>`}
else if(page==='report'){const r=state.reports.find(r=>r.id===id);if(!r){location.hash='/library';return}out=`<a href="#/company/${r.companyId}" style="color:var(--green)">← 기업 도서관</a>`+header(esc(r.title),`${esc(r.type)} · ${esc(r.date)}`,`<button data-action="report" data-id="${r.companyId}" data-edit="${r.id}">수정</button>${r.fileData?`<button class="primary" data-action="download" data-id="${r.id}">첨부파일 다운로드</button>`:''}`)+`<section class="panel" style="margin-top:25px"><div class="pre">${esc(r.body||'본문 없이 첨부된 보고서입니다.')}</div>${r.url?`<p style="margin-top:24px"><a href="${esc(r.url)}" target="_blank" rel="noopener noreferrer">원문 링크 열기 ↗</a></p>`:''}${r.fileName?`<p>첨부: ${esc(r.fileName)}</p>`:''}</section>`}
else if(page==='library'){out=header('리서치 도서관','모든 기업의 투자 판단과 리서치 기록',backup)+`<section class="panel" style="margin-top:25px"><div class="filters"><input id="search" type="search" placeholder="제목, 본문, 기업명 검색" aria-label="자료 검색"><select id="type" aria-label="자료 종류"><option value="">모든 자료 유형</option>${['투자심의','실사','분기 모니터링','미팅 노트','회수 검토','기타'].map(s=>`<option>${s}</option>`).join('')}</select></div><div id="results"></div></section>`}
else{const invested=state.deals.filter(d=>['투자완료','회수진행','회수완료'].includes(d.status));out=header('투자 대시보드','기업과 딜, 축적된 리서치를 한눈에 확인하세요.',newCompany)+`<div class="notice">현재 브라우저에 저장 · 다른 기기 및 GitHub에 자동 동기화되지 않습니다. 첨부파일을 포함한 백업을 정기적으로 내려받으세요.</div><div class="stats"><div class="stat"><span>관리 기업</span><strong>${state.companies.length}<small> 개</small></strong></div><div class="stat"><span>누적 투자액 · 입력 기준</span><strong>${num(invested.reduce((a,d)=>a+Number(d.amount),0))}<small> 억</small></strong></div><div class="stat"><span>관리 딜</span><strong>${state.deals.length}<small> 건</small></strong></div><div class="stat"><span>리서치 자료</span><strong>${state.reports.length}<small> 개</small></strong></div></div><section class="panel"><div class="top"><h2>포트폴리오 기업</h2><span class="muted">기업명을 클릭하여 도서관 열기</span></div><div class="filters"><input id="search" type="search" placeholder="기업명, 산업, 투자 논리 검색" aria-label="기업 검색"><select id="fund" aria-label="조합 필터"><option value="">모든 조합</option>${[...new Set(state.deals.map(d=>d.fund))].filter(Boolean).map(f=>`<option>${esc(f)}</option>`).join('')}</select><select id="stage" aria-label="단계 필터"><option value="">모든 단계</option>${['Seed','Series A','Series B','Growth','Pre-IPO','기타'].map(x=>`<option>${x}</option>`).join('')}</select></div><div id="results"></div></section><section class="panel"><div class="top"><h2>최근 등록 자료</h2><a href="#/library" style="color:var(--green)">전체 보기 →</a></div>${reportCards([...state.reports].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,3))}</section><div class="actions">${backup}${!state.companies.length?'<button data-action="demo">가상 예시로 둘러보기</button>':''}</div>`}
$('#app').innerHTML=out+'<footer>DEAL DESK · 기업 중심 투자 기록실 · 입력된 수치는 사용자가 관리하는 기록입니다.</footer>';if($('#search')){$('#search').oninput=filter;document.querySelectorAll('.filters select').forEach(e=>e.onchange=filter);filter()}}
function filter(){const q=$('#search').value.toLowerCase();if(location.hash.startsWith('#/library')){const type=$('#type').value;$('#results').innerHTML=reportCards(state.reports.filter(r=>(!type||r.type===type)&&[r.title,r.body,state.companies.find(c=>c.id===r.companyId)?.name].join(' ').toLowerCase().includes(q)).sort((a,b)=>b.date.localeCompare(a.date)));return}const fund=$('#fund').value,stage=$('#stage').value,cs=state.companies.filter(c=>(!stage||c.stage===stage)&&(!fund||state.deals.some(d=>d.companyId===c.id&&d.fund===fund))&&[c.name,c.sector,c.thesis].join(' ').toLowerCase().includes(q));$('#results').innerHTML=cs.length?`<div class="scroll"><table><thead><tr><th>기업 / 산업</th><th>투자 단계</th><th>관리 딜</th><th>자료</th><th>담당자</th></tr></thead><tbody>${cs.map(c=>`<tr><td><a href="#/company/${c.id}">${esc(c.name)} ↗</a><div class="muted">${esc(c.sector)}</div></td><td><span class="badge">${esc(c.stage)}</span></td><td>${state.deals.filter(d=>d.companyId===c.id).length}건</td><td>${state.reports.filter(r=>r.companyId===c.id).length}개</td><td>${esc(c.manager||'—')}</td></tr>`).join('')}</tbody></table></div>`:`<div class="empty">${state.companies.length?'검색 조건에 맞는 기업이 없습니다.':'아직 등록된 기업이 없습니다.<br>기업을 등록하고 투자 기록을 쌓아보세요.'}</div>`}
function field(label,name,value='',type='text',required=false){return `<label>${label}<input name="${name}" type="${type}" value="${esc(value)}" ${required?'required':''} ${type==='number'?'min="0" step="any"':''}></label>`}
function area(label,name,value=''){return `<label>${label}<textarea name="${name}">${esc(value)}</textarea></label>`}
function options(label,name,vals,value){return `<label>${label}<select name="${name}">${vals.map(v=>`<option ${v===value?'selected':''}>${esc(v)}</option>`).join('')}</select></label>`}
function editor(kind,cid,edit){let current=kind==='company'?state.companies.find(c=>c.id===cid):state[kind==='deal'?'deals':'reports'].find(x=>x.id===edit);current=current||{};let fields='';if(kind==='company')fields=field('기업명 *','name',current.name,'text',true)+field('산업','sector',current.sector)+options('투자 단계','stage',['Seed','Series A','Series B','Growth','Pre-IPO','기타'],current.stage)+field('담당자','manager',current.manager)+area('기업 소개','summary',current.summary)+area('핵심 투자 논리','thesis',current.thesis);else if(kind==='deal')fields=field('딜 이름 *','name',current.name,'text',true)+field('투자 조합 *','fund',current.fund,'text',true)+field('투자일','date',current.date||today(),'date',true)+field('투자금액 · 억원 *','amount',current.amount,'number',true)+options('상태','status',['검토중','투자완료','회수진행','회수완료','보류'],current.status);else fields=field('자료 제목 *','title',current.title,'text',true)+options('자료 유형','type',['투자심의','실사','분기 모니터링','미팅 노트','회수 검토','기타'],current.type)+field('작성일','date',current.date||today(),'date',true)+`<label>연결 딜<select name="dealId"><option value="">기업 공통</option>${state.deals.filter(d=>d.companyId===cid).map(d=>`<option value="${d.id}" ${d.id===current.dealId?'selected':''}>${esc(d.name)} · ${esc(d.fund)}</option>`).join('')}</select></label>`+area('본문 / 핵심 요약','body',current.body)+field('원문 링크 · HTTPS','url',current.url,'url')+`<label>보고서 첨부 · 파일당 최대 20MB<input type="file" name="attachment" accept=".pdf,.doc,.docx,.ppt,.pptx,.xls,.xlsx,.txt,.md,.csv,.png,.jpg,.jpeg"></label><div class="muted">${esc(current.fileName||'PDF·Word·Excel 등 원본을 보관하고 다운로드할 수 있습니다.')} · 새 파일 선택 시 기존 첨부 교체</div>`;$('#modal').innerHTML=`<form><h2>${kind==='company'?'기업':kind==='deal'?'투자 딜':'노트 / 보고서'} ${current.id?'수정':'등록'}</h2>${fields}<p id="error" role="alert" style="color:#a22"></p><div class="actions"><button type="button" data-action="close">취소</button><button class="primary" type="submit">저장</button></div></form>`;$('#modal').showModal();$('#modal form').onsubmit=async e=>{e.preventDefault();const btn=e.submitter;btn.disabled=true;try{const f=new FormData(e.target),obj={...current,...Object.fromEntries([...f.entries()].filter(([k])=>k!=='attachment')),id:current.id||uid()};if(kind!=='company')obj.companyId=cid;if(kind==='deal')obj.amount=Number(obj.amount);if(kind==='report'){if(obj.url&&!/^https:\/\//i.test(obj.url))throw Error('원문 링크는 https://로 시작해야 합니다.');const file=f.get('attachment');if(file?.size){if(file.size>20*1024*1024)throw Error('첨부파일은 20MB 이하로 선택해주세요.');obj.fileName=file.name;obj.fileData=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file)})}}const key=kind==='company'?'companies':kind==='deal'?'deals':'reports',next=structuredClone(state),idx=next[key].findIndex(x=>x.id===obj.id);if(idx<0)next[key].push(obj);else next[key][idx]=obj;await save(next);$('#modal').close();toast('저장했습니다.');if(kind==='company')location.hash='/company/'+obj.id}catch(err){$('#error').textContent=err.message||'저장에 실패했습니다. 브라우저 저장 공간을 확인하세요.'}finally{btn.disabled=false}}}
function download(data,name){const a=document.createElement('a');a.href=data;a.download=name;a.click()}
function validBackup(s){if(!s||!['companies','deals','reports'].every(k=>Array.isArray(s[k])))return false;const ids=new Set();for(const c of s.companies){if(typeof c.id!=='string'||!/^[-\w]+$/.test(c.id)||typeof c.name!=='string'||ids.has(c.id))return false;ids.add(c.id)}for(const key of ['deals','reports']){const seen=new Set();for(const r of s[key]){if(typeof r.id!=='string'||!/^[-\w]+$/.test(r.id)||seen.has(r.id)||!ids.has(r.companyId)||typeof r.date!=='string')return false;seen.add(r.id);if(key==='deals'&&(!Number.isFinite(Number(r.amount))||Number(r.amount)<0))return false;if(key==='reports'&&(typeof r.title!=='string'||(r.url&&!/^https:\/\//i.test(r.url))||(r.fileData&&!/^data:[^,]*;base64,[A-Za-z0-9+/=]*$/.test(r.fileData))))return false}}return true}
document.addEventListener('click',async e=>{const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action;try{if(['company','deal','report'].includes(a))editor(a,b.dataset.id,b.dataset.edit);if(a==='close')$('#modal').close();if(a==='download'){const r=state.reports.find(r=>r.id===b.dataset.id);download(r.fileData,r.fileName)}if(a==='export'){const url=URL.createObjectURL(new Blob([JSON.stringify({version:1,...state},null,2)],{type:'application/json'}));download(url,'deal-desk-backup-'+today()+'.json');setTimeout(()=>URL.revokeObjectURL(url),5000)}if(a==='import'){const input=document.createElement('input');input.type='file';input.accept='.json';input.onchange=async()=>{try{const data=JSON.parse(await input.files[0].text());if(!validBackup(data))throw Error('지원하지 않거나 손상된 백업 파일입니다.');if(!confirm('현재 브라우저 자료를 백업 파일로 교체합니다. 기존 자료는 먼저 백업해주세요. 계속할까요?'))return;await save({companies:data.companies,deals:data.deals,reports:data.reports});toast('백업을 불러왔습니다.')}catch(err){alert(err.message)}};input.click()}if(a==='demo'){if(state.companies.length)return;const id=uid();await save({companies:[{id,name:'예시 · 오로라테크',sector:'기업용 소프트웨어 (가상)',stage:'Growth',manager:'예시 담당자',summary:'기능 확인을 위한 가상 기업입니다. 실제 투자자료가 아닙니다.',thesis:'반복 매출의 성장과 고객 유지율을 점검합니다.'}],deals:[{id:uid(),companyId:id,name:'예시 · 성장투자',fund:'예시 · 성장 1호 조합',date:'2026-11-05',amount:10,status:'투자완료'}],reports:[{id:uid(),companyId:id,title:'예시 · 분기 모니터링 노트',date:'2026-11-05',type:'분기 모니터링',body:'이 문서는 기능 확인용 가상 예시입니다.\n\n1. 투자 논리 점검\n반복 매출 및 고객 유지율 추이를 확인합니다.\n\n2. 주요 리스크\n고객 집중도, 현금 소진 및 추가 자금조달 일정을 검토합니다.\n\n3. 다음 미팅 질문\n분기 실적, 수주 파이프라인 및 인력 계획을 확인합니다.'}]});toast('가상 예시가 추가되었습니다.')}}catch(err){toast('처리하지 못했습니다: '+err.message)}});
window.addEventListener('hashchange',render);init();
</script></body></html>
